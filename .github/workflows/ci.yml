name: ci

on:
  push:
    branches: [main]
  pull_request:

# vLLM is not installed here. CI covers lint and the packaging tests; the
# scheduler tests are marked `requires_vllm` and skip, reported in the run
# header. They run against the real serving image via `make test-container`.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test
        run: python -m pytest -q
